apiVersion: hpo.ai/v1
kind: SkillExtension
metadata:
  name: hpo-metric-query-readonly
  displayName: HPO Metric Query Readonly
  version: 1.1.2
  owner: platform-team
  status: candidate
spec:
  category: metric-query
  capabilities: [query-metric-readonly/v2]
  permissions:
    read: [task.context, provider.metric_metadata, provider.metric_values]
    deny: [experiment.create, experiment.control, task.mutate, evidence.write]
provenance:
  sourceType: bundled-publish-source
